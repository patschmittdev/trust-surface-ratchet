<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Write-time redact vs read-time sanitize</title>
  <desc>One inbound payload splits into two non-overlapping defenses: a redact hook runs at the storage write boundary; a sanitizer runs at the model read boundary. Different fields, different surfaces, different reasons.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 14px; fill: #4b5563; }
      .section { font-size: 12px; font-weight: 700; fill: #64748b; text-transform: uppercase; }
      .card-title { font-size: 17px; font-weight: 700; fill: #111827; }
      .body { font-size: 13px; fill: #374151; }
      .small { font-size: 12px; fill: #475569; }
      .tiny { font-size: 11px; fill: #64748b; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="580" fill="#ffffff"/>

  <text x="560" y="43" text-anchor="middle" class="title">Write-time redact vs read-time sanitize</text>
  <text x="560" y="70" text-anchor="middle" class="subtitle">Two non-overlapping defenses on different surfaces. Composition, not redundancy.</text>

  <g>
    <rect x="370" y="100" width="380" height="74" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="560" y="128" text-anchor="middle" class="card-title">inbound payload</text>
    <text x="560" y="152" text-anchor="middle" class="body">worker update from child</text>
    <text x="560" y="167" text-anchor="middle" class="tiny mono">{ text, secrets?, env? }</text>
  </g>

  <path d="M 460 174 L 345 198" class="line"/>
  <path d="M 660 174 L 775 198" class="line"/>

  <text x="60" y="218" class="section">Write path: storage boundary</text>

  <g>
    <rect x="60" y="232" width="420" height="248" rx="8" fill="#eff6ff" stroke="#0078d4" stroke-width="2"/>
    <text x="80" y="262" class="card-title">Host redact hook</text>
    <text x="80" y="286" class="small">applied at host store write</text>
    <text x="80" y="306" class="tiny">host redact hook at write</text>

    <rect x="80" y="320" width="380" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="98" y="345" class="body mono">redact kind: event log -&gt; update payload</text>

    <rect x="80" y="364" width="380" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="98" y="389" class="body mono">redact kind: pending approval -&gt; preview</text>

    <rect x="80" y="408" width="380" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="98" y="433" class="body mono">returns redacted form (e.g. [redact:secret])</text>

    <text x="80" y="468" class="small">Event log stores only the redacted form</text>
  </g>

  <text x="640" y="218" class="section">Read path: model boundary</text>

  <g>
    <rect x="640" y="232" width="420" height="248" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="660" y="262" class="card-title">sanitize child text</text>
    <text x="660" y="286" class="small">applied at snapshot read for status</text>
    <text x="660" y="306" class="tiny">sanitizer at model read</text>

    <rect x="660" y="330" width="380" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="678" y="354" class="body">Six ordered read-boundary steps sanitize</text>
    <text x="678" y="374" class="body">child text before model-visible snapshots.</text>

    <rect x="660" y="408" width="380" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="678" y="433" class="body mono">see sanitizer-pipeline.svg for step order</text>

    <text x="660" y="468" class="small">Read-time only: original write remains available to audit.</text>
  </g>

  <g>
    <rect x="60" y="500" width="1000" height="62" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="524" class="card-title">Why both?</text>
    <text x="80" y="544" class="small">Different threats. Redact targets confidentiality at rest (storage). Sanitize targets prompt-injection at the model context (read).</text>
    <text x="80" y="558" class="small">Removing either re-opens its surface. Order is fixed: redact before audit log; sanitize before model read.</text>
  </g>
</svg>
