<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Transitive delegation parent linking</title>
  <desc id="desc">A host wraps the root store with a child-store wrapper before exposing tools to a nested child worker.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
    </marker>
    <style>
      text { font-family: Segoe UI, sans-serif; fill: #111827; }
      .box { fill: #f9fafb; stroke: #374151; stroke-width: 2; rx: 10; }
      .host { fill: #ecfeff; stroke: #0e7490; }
      .tool { fill: #fff7ed; stroke: #c2410c; }
      .store { fill: #f0fdf4; stroke: #15803d; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; }
      .arrow { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .strip { stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="35" y="70" width="180" height="100" class="box" />
  <text x="125" y="112" text-anchor="middle" class="label">Child model</text>
  <text x="125" y="140" text-anchor="middle" class="small">calls delegate</text>
  <text x="125" y="160" text-anchor="middle" class="small">may spoof parent id</text>

  <rect x="285" y="70" width="210" height="100" class="box tool" />
  <text x="390" y="106" text-anchor="middle" class="label">host tool layer</text>
  <text x="390" y="136" text-anchor="middle" class="small">strips host-only fields</text>
  <text x="390" y="156" text-anchor="middle" class="small">parent id is discarded</text>

  <rect x="565" y="70" width="225" height="100" class="box host" />
  <text x="677" y="106" text-anchor="middle" class="label">child store wrapper</text>
  <text x="677" y="136" text-anchor="middle" class="small">injects trusted parent id</text>
  <text x="677" y="156" text-anchor="middle" class="small">from host state</text>

  <rect x="610" y="235" width="210" height="80" class="box store" />
  <text x="715" y="270" text-anchor="middle" class="label">host store</text>
  <text x="715" y="288" text-anchor="middle" class="small">validates parent id,</text>
  <text x="715" y="306" text-anchor="middle" class="small">narrows trust tier</text>

  <path d="M 215 120 H 285" class="arrow" />
  <path d="M 495 120 H 565" class="arrow" />
  <path d="M 680 170 V 235" class="arrow" />

  <path d="M 250 202 C 360 230, 440 230, 540 202" class="strip" />
  <text x="395" y="250" text-anchor="middle" class="small" fill="#b91c1c">model-authored parent id stops here</text>
</svg>
