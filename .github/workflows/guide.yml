name: Guide

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proofs:
    name: Lean proofs build and no-sorry gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache elan and Lean toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('guide/proofs/lean-toolchain') }}

      - name: Install elan
        run: |
          # elan v4.3.0; SHA-256 from the GitHub release asset digest.
          # Update the version and digest together.
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.3.0/elan-x86_64-unknown-linux-gnu.tar.gz -o elan.tar.gz
          echo "0c71472fa3ac34871dc1e2539993cca222d7656b42a1469f8f8c97c22f9adab2  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build proofs
        working-directory: guide/proofs
        run: lake build

      - name: Assert zero sorry
        working-directory: guide/proofs
        run: |
          if grep -rn --include='*.lean' -w sorry Proofs.lean Proofs; then
            echo "Found 'sorry' in the proof corpus. The build must stay complete."
            exit 1
          fi
          echo "No sorry found."

  neutrality:
    name: Neutrality guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check for private-context tokens
        working-directory: guide
        env:
          NEUTRALITY_DENYLIST: ${{ secrets.NEUTRALITY_DENYLIST }}
          NEUTRALITY_REQUIRE_DENYLIST: ${{ github.event_name == 'push' && !github.event.repository.fork }}
        run: node scripts/check-neutrality.mjs

  links:
    name: Internal link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check relative markdown links
        working-directory: guide
        run: node scripts/check-links.mjs
