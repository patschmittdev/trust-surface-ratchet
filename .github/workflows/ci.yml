name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 24
          - os: windows-2025
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

      - name: Run standalone lockdown gate
        run: npm run check:lockdowns

      - name: Run adopter fixture tests
        run: npm run test:fixture

      - name: Run adopter fixture gate
        run: npm run check:fixture

      - name: Run strict adopter fixture gate
        run: npm run check:fixture:strict

      - name: Check guide fixture
        run: node guide/examples/ratchet-fixture/check

      - name: Check guide links
        run: npm run check:guide-links
