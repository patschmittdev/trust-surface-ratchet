name: Coverage gate bug
description: Report incorrect discovery, validation, path handling, or diagnostics
title: "[Gate bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Provide the smallest reproducible example. Do not include private source code or security-sensitive bypass details. Use private vulnerability reporting for a plausible required-check bypass.
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.20.0"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, or macOS 15"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the source shape, gate configuration, and exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include complete standard output, standard error, and exit status.
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure check
      options:
        - label: This report does not contain private code, credentials, or exploit details that belong in a private vulnerability report.
          required: true
